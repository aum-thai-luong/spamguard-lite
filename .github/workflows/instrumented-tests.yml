name: Instrumented test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # minSdk và một bản gần đây.
        api-level: [ 26, 34 ]

    steps:
      - name: Bật KVM cho emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v7

      - name: Cài JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu

      - name: Cài Gradle (có cache)
        uses: gradle/actions/setup-gradle@v5

      # Test dùng HiltTestRunner và FakeDataModule: không cần nhật ký cuộc gọi thật trên emulator.
      - name: Chạy instrumented test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Lưu báo cáo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
